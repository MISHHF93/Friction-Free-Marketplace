name: Release web

on:
  workflow_dispatch:
    inputs:
      deploy_vercel:
        description: Deploy production to Vercel
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate container release configuration
        shell: bash
        env:
          APP_URL: ${{ vars.PRODUCTION_APP_URL }}
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        run: |
          node -e "const u=new URL(process.env.APP_URL); if(u.protocol!=='https:') process.exit(1)"
          node -e "new URL(process.env.SUPABASE_URL)"
          test -n "$SUPABASE_ANON_KEY"
          test -n "$STRIPE_PUBLISHABLE_KEY"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          load: true
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.PRODUCTION_APP_URL }}
            NEXT_PUBLIC_APP_NAME=Friction-Free Marketplace
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Smoke test immutable container
        env:
          APP_URL: ${{ vars.PRODUCTION_APP_URL }}
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ANDROID_FINGERPRINTS: ${{ secrets.ANDROID_SHA256_CERT_FINGERPRINTS }}
        run: |
          docker run -d --name marketplace-release -p 3000:3000 \
            -e NEXT_PUBLIC_APP_URL="$APP_URL" \
            -e NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
            -e NEXT_PUBLIC_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            -e SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY" \
            -e STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY" \
            -e STRIPE_WEBHOOK_SECRET="$STRIPE_WEBHOOK_SECRET" \
            -e NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="$STRIPE_PUBLISHABLE_KEY" \
            -e SUPPORT_EMAIL="$SUPPORT_EMAIL" \
            -e APPLE_TEAM_ID="$APPLE_TEAM_ID" \
            -e ANDROID_SHA256_CERT_FINGERPRINTS="$ANDROID_FINGERPRINTS" \
            -e RELEASE_SHA="${{ github.sha }}" \
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          for attempt in {1..30}; do
            curl --fail http://127.0.0.1:3000/api/health && break
            sleep 2
          done
          PRODUCTION_URL=http://127.0.0.1:3000 SMOKE_ALLOW_LOCAL_HTTP=1 SMOKE_OUTPUT=container-smoke-evidence.json node scripts/production-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-release-proof-${{ github.sha }}
          path: container-smoke-evidence.json
          if-no-files-found: warn

  vercel:
    if: inputs.deploy_vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate Vercel release configuration
        shell: bash
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$TOKEN"
          test -n "$ORG_ID"
          test -n "$PROJECT_ID"
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Verify deployed production origin
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_APP_URL }}
          SMOKE_OUTPUT: production-smoke-evidence.json
        run: node scripts/production-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-release-proof-${{ github.sha }}
          path: production-smoke-evidence.json
          if-no-files-found: warn
